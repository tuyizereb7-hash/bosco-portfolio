<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bosco Portfolio</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->

    <div class="left">

        <h1>Welcome Back!</h1>

        <p>
            Login to continue exploring Bosco's Portfolio.
        </p>

        <img src="./images/Screenshot from 2026-09-17 11-24-45.png"
             alt="Bosco">
            
    </div>



    <!-- RIGHT SIDE -->

    <div class="right">

        <div class="login-box">

            <h2>Login</h2>

            <form id="loginForm">

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <span id="togglePassword">
                        <i class="fa-solid fa-eye"></i>
                    </span>

                </div>


                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>


                    <a href="./signup.html">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-btn">

                    Login

                </button>


                <p id="error"></p>


                <div class="signup-link">

                    Don't have an account?

                    <a href="signup.html">

                        Sign Up

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- <script src="login.js"></script> -->
 
<script type="module" src="login.js"></script>

</body>
</html>
